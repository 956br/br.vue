<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اختبار التعليقات والهدايا</title>
<style>
  body { font-family: system-ui, sans-serif; background:#1a1a2e; color:#fff; padding:30px; }
  h2 { color:#f1c40f; }
  input, button { padding:12px; font-size:1rem; border-radius:8px; border:none; }
  input { width:260px; background:#0f0f1e; color:#fff; border:1px solid #444; }
  button { background:#2ecc71; color:#fff; cursor:pointer; font-weight:bold; }
  #status { font-weight:bold; margin:15px 0; }
  .counts { display:flex; gap:12px; margin:15px 0; flex-wrap:wrap; }
  .counts div { background:#0f0f1e; border:1px solid #333; border-radius:8px; padding:10px 18px; }
  #log { background:#0f0f1e; border:1px solid #333; border-radius:8px; padding:15px;
         height:400px; overflow-y:auto; font-size:0.95rem; line-height:1.8; }
  .c { color:#7ee787; }
  .g { color:#ff9ecd; }
  .g b { color:#fff; }
  .meta { color:#888; font-size:0.85rem; }
  .s { color:#f1c40f; }
</style>
</head>
<body>
  <h2>اختبار التعليقات والهدايا</h2>

  <input type="text" id="u" placeholder="اسم حساب تيك توك (بدون @)">
  <button onclick="go()">اتصال</button>

  <p id="status">غير متصل</p>

  <div class="counts">
    <div>💬 تعليقات: <span id="cCount">0</span></div>
    <div>🎁 هدايا: <span id="gCount">0</span></div>
    <div>💎 مجموع الألماس: <span id="dCount">0</span></div>
  </div>

  <div id="log"></div>

<script>
let sock = null;
let comments = 0, gifts = 0, diamonds = 0;

function add(html, cls) {
  const d = document.createElement('div');
  d.className = cls || '';
  d.innerHTML = html;
  document.getElementById('log').prepend(d);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function go() {
  const user = document.getElementById('u').value.trim();
  const st = document.getElementById('status');
  if (!user) { st.textContent = 'اكتب اسم الحساب أول'; return; }

  if (sock) sock.close();
  st.textContent = 'جاري الاتصال...';
  st.style.color = '#f1c40f';

  sock = new WebSocket('wss://bridge-vue.956br.fun?user=' + encodeURIComponent(user));

  sock.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.ping) return;

    if (d.status) { st.textContent = d.status; st.style.color = '#2ecc71'; add(esc(d.status), 's'); }
    if (d.error)  { st.textContent = d.error;  st.style.color = '#e74c3c'; add(esc(d.error), 's'); }

    if (d.type === 'gift') {
      gifts++;
      const each = Number(d.diamonds) || 0;
      const total = each * (Number(d.count) || 1);
      diamonds += total;

      document.getElementById('gCount').textContent = gifts;
      document.getElementById('dCount').textContent = diamonds;

      const name = d.giftName || ('هدية #' + d.giftId);
      const kind = d.giftType === 1 ? 'قابلة للتكرار' : 'عادية';

      add(
        '🎁 <b>' + esc(d.user) + '</b> أرسل <b>' + esc(name) + '</b> × ' + esc(d.count) +
        '<div class="meta">' +
        'رقم الهدية: ' + esc(d.giftId) +
        ' • النوع: ' + kind + ' (' + esc(d.giftType) + ')' +
        ' • الألماس للواحدة: ' + each +
        ' • الإجمالي: ' + total +
        '</div>',
        'g'
      );
      return;
    }

    if (d.comment) {
      comments++;
      document.getElementById('cCount').textContent = comments;
      add('💬 <b>' + esc(d.user) + '</b>: ' + esc(d.comment), 'c');
    }
  };

  sock.onerror = () => { st.textContent = 'خطأ بالاتصال'; st.style.color = '#e74c3c'; };
  sock.onclose = () => { st.textContent = 'انقطع الاتصال'; st.style.color = '#888'; };
}
</script>
</body>
</html>
